name: Publish docs

on:
  push:
    branches: [ main ] # branch to trigger deployment

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
    - id: deployment
      uses: sphinx-notes/pages@3b962c125b2db7b1f5194d949873fa46d6101d0f # 3.7
