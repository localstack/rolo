name: CI

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
    branches:
      - main
    tags:
      - 'v*.*'
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14", "3.15" ]
    permissions:
      contents: read
    env:
      COVERAGE_PYTHON_VERSION: "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run install
        run: |
          make install

      - name: Run linting
        run: |
          make lint

      # coverage only runs on one version: before 3.14 it traces with sys.settrace, which slows the tests down
      # several times and makes the timing-sensitive tests flaky. 3.14+ uses sys.monitoring (PEP 669).
      - name: Run tests
        if: matrix.python-version != env.COVERAGE_PYTHON_VERSION
        run: |
          make test

      - name: Run tests with coverage
        if: matrix.python-version == env.COVERAGE_PYTHON_VERSION
        run: |
          make test-coverage

      - name: Report coverage
        if: matrix.python-version == env.COVERAGE_PYTHON_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make coveralls

  release:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rolo
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build release
        run: make dist

      - name: List artifacts
        run: ls -lah dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
